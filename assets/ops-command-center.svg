<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#030712"/>
    <stop offset="45%" stop-color="#071426"/>
    <stop offset="100%" stop-color="#061E2A"/>
  </linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#22D3EE"/>
    <stop offset=".52" stop-color="#3B82F6"/>
    <stop offset="1" stop-color="#A855F7"/>
  </linearGradient>
  <linearGradient id="hot" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#34D399"/>
    <stop offset="1" stop-color="#22D3EE"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#1E3A5F" stroke-opacity=".18"/>
  </pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="blur"><feGaussianBlur stdDeviation="30"/></filter>
</defs>

<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<rect width="1400" height="560" rx="34" fill="url(#grid)"/>
<rect x="0" y="0" width="1400" height="6" fill="url(#edge)"/>

<circle cx="1090" cy="130" r="140" fill="#22D3EE" opacity=".05" filter="url(#blur)"/>
<circle cx="1190" cy="410" r="160" fill="#8B5CF6" opacity=".05" filter="url(#blur)"/>

<!-- command console -->
<rect x="55" y="72" width="545" height="410" rx="24" fill="#050B15" stroke="#214566" stroke-width="2"/>
<circle cx="88" cy="104" r="7" fill="#FB7185"/>
<circle cx="112" cy="104" r="7" fill="#FBBF24"/>
<circle cx="136" cy="104" r="7" fill="#34D399"/>
<text x="170" y="110" fill="#64748B" font-family="monospace" font-size="15">ops-console / production</text>
<line x1="55" y1="134" x2="600" y2="134" stroke="#17324D"/>

<g font-family="monospace" font-size="18">
  <text x="84" y="174" fill="#64748B">$</text>
  <text x="106" y="174" fill="#22D3EE">whoami</text>
  <text x="106" y="203" fill="#E2E8F0">hari-patel / devops-engineer</text>

  <text x="84" y="241" fill="#64748B">$</text>
  <text x="106" y="241" fill="#60A5FA">infra</text>
  <text x="172" y="241" fill="#E2E8F0">status</text>
  <text x="106" y="270" fill="#34D399">cloud ............ ONLINE</text>
  <text x="106" y="297" fill="#34D399">containers ....... READY</text>
  <text x="106" y="324" fill="#34D399">delivery .......... ONLINE</text>
  <text x="106" y="351" fill="#FBBF24">orchestration ..... LEARNING</text>

  <text x="84" y="390" fill="#64748B">$</text>
  <text x="106" y="390" fill="#A78BFA">deploy</text>
  <text x="188" y="390" fill="#E2E8F0">--strategy reliable</text>
  <text x="106" y="419" fill="#34D399">✓ build   ✓ ship   ✓ observe   ✓ scale</text>
</g>

<!-- identity -->
<text x="655" y="134" fill="#F8FAFC" font-family="Arial,sans-serif" font-weight="800" font-size="76">HARI PATEL</text>
<text x="658" y="182" fill="#22D3EE" font-family="Arial,sans-serif" font-weight="800" font-size="31">DEVOPS ENGINEER</text>
<text x="658" y="220" fill="#CBD5E1" font-family="Arial,sans-serif" font-size="21">Cloud Infrastructure • Automation • Reliability</text>

<!-- node map -->
<g font-family="Arial,sans-serif" font-weight="700" font-size="15">
  <rect x="658" y="258" width="138" height="62" rx="17" fill="#0B2031" stroke="#22D3EE"/>
  <text x="727" y="296" fill="#E2E8F0" text-anchor="middle">AWS</text>
  <rect x="826" y="258" width="138" height="62" rx="17" fill="#0B2031" stroke="#60A5FA"/>
  <text x="895" y="296" fill="#E2E8F0" text-anchor="middle">DOCKER</text>
  <rect x="994" y="258" width="138" height="62" rx="17" fill="#0B2031" stroke="#A78BFA"/>
  <text x="1063" y="296" fill="#E2E8F0" text-anchor="middle">TERRAFORM</text>
  <rect x="1162" y="258" width="138" height="62" rx="17" fill="#0B2031" stroke="#34D399"/>
  <text x="1231" y="296" fill="#E2E8F0" text-anchor="middle">KUBERNETES</text>

  <path d="M796 289H826M964 289H994M1132 289H1162" stroke="url(#edge)" stroke-width="4"/>
  <circle cx="658" cy="289" r="6" fill="#22D3EE" filter="url(#glow)">
    <animate attributeName="cx" values="658;1300;658" dur="5s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- process strip -->
<g font-family="monospace">
  <rect x="658" y="355" width="642" height="48" rx="24" fill="#081B2B" stroke="#234A67"/>
  <text x="686" y="385" font-size="16" fill="#94A3B8">FLOW</text>
  <text x="750" y="385" font-size="16" fill="#22D3EE">BUILD</text>
  <text x="824" y="385" font-size="16" fill="#64748B">→</text>
  <text x="850" y="385" font-size="16" fill="#60A5FA">DEPLOY</text>
  <text x="939" y="385" font-size="16" fill="#64748B">→</text>
  <text x="965" y="385" font-size="16" fill="#A78BFA">OBSERVE</text>
  <text x="1063" y="385" font-size="16" fill="#64748B">→</text>
  <text x="1089" y="385" font-size="16" fill="#34D399">SCALE</text>
</g>

<!-- mini metrics -->
<g font-family="monospace">
  <rect x="658" y="433" width="196" height="58" rx="15" fill="#081C1A" stroke="#1B5B4D"/>
  <circle cx="682" cy="462" r="6" fill="#34D399" filter="url(#glow)"/>
  <text x="698" y="468" font-size="15" fill="#A7F3D0">CI/CD ONLINE</text>

  <rect x="872" y="433" width="196" height="58" rx="15" fill="#0A1C2B" stroke="#20537B"/>
  <circle cx="896" cy="462" r="6" fill="#60A5FA" filter="url(#glow)"/>
  <text x="912" y="468" font-size="15" fill="#BFDBFE">CLOUD READY</text>

  <rect x="1086" y="433" width="214" height="58" rx="15" fill="#17112A" stroke="#513276"/>
  <circle cx="1110" cy="462" r="6" fill="#A78BFA" filter="url(#glow)"/>
  <text x="1126" y="468" font-size="15" fill="#DDD6FE">AUTOMATION ACTIVE</text>
</g>

<!-- bottom line -->
<path d="M650 525 H1300" stroke="#1F4059" stroke-width="2"/>
<path d="M650 525 H650">
  <animate attributeName="d" values="M650 525 H650;M650 525 H1060;M650 525 H1300;M650 525 H650" dur="4s" repeatCount="indefinite"/>
</path>
<text x="58" y="525" fill="#334155" font-family="monospace" font-size="14">production-minded engineering</text>
<text x="1340" y="525" fill="#475569" font-family="monospace" font-size="14" text-anchor="end">secure • repeatable • observable</text>
</svg>