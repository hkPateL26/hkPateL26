<svg width="1400" height="560" viewBox="0 0 1400 560" xmlns="http://www.w3.org/2000/svg">
<defs>
  <radialGradient id="bg" cx="50%" cy="50%" r="75%">
    <stop offset="0%" stop-color="#102943"/>
    <stop offset="52%" stop-color="#07172A"/>
    <stop offset="100%" stop-color="#030812"/>
  </radialGradient>

  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#22D3EE"/>
    <stop offset="100%" stop-color="#3B82F6"/>
  </linearGradient>

  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#8B5CF6"/>
    <stop offset="100%" stop-color="#EC4899"/>
  </linearGradient>

  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
    <path d="M32 0H0V32" fill="none" stroke="#21415E" stroke-opacity=".17"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4.5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="soft">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
</defs>

<rect width="1400" height="560" rx="34" fill="url(#bg)"/>
<rect width="1400" height="560" rx="34" fill="url(#grid)"/>

<!-- Ambient lighting -->
<circle cx="700" cy="290" r="155" fill="#22D3EE" opacity=".045" filter="url(#soft)"/>
<circle cx="700" cy="290" r="250" fill="none" stroke="#1B4564" stroke-opacity=".16"/>
<circle cx="700" cy="290" r="205" fill="none" stroke="#1B4564" stroke-opacity=".20"/>
<circle cx="700" cy="290" r="160" fill="none" stroke="#1B4564" stroke-opacity=".24"/>

<!-- Header -->
<text x="48" y="48" fill="#64748B" font-family="monospace" font-size="14" letter-spacing="1.2">
  HARI.PATEL / DEVOPS.ENGINEER / CLOUD.SYSTEMS
</text>

<circle cx="1260" cy="45" r="7" fill="#34D399" filter="url(#glow)">
  <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
</circle>
<text x="1280" y="51" fill="#A7F3D0" font-family="monospace" font-size="13">SYSTEM ONLINE</text>

<!-- Connection paths -->
<g fill="none" stroke-width="2.5">
  <path id="aws" d="M585 242 C490 205 405 165 280 145" stroke="#22D3EE" stroke-opacity=".68"/>
  <path id="gha" d="M565 290 C455 290 360 290 250 290" stroke="#60A5FA" stroke-opacity=".68"/>
  <path id="docker" d="M585 338 C490 375 405 415 280 435" stroke="#A78BFA" stroke-opacity=".68"/>

  <path id="tf" d="M815 242 C910 205 995 165 1120 145" stroke="#8B5CF6" stroke-opacity=".68"/>
  <path id="nginx" d="M835 290 C945 290 1040 290 1150 290" stroke="#F59E0B" stroke-opacity=".68"/>
  <path id="linux" d="M815 338 C910 375 995 415 1120 435" stroke="#EC4899" stroke-opacity=".68"/>
</g>

<!-- Moving packets -->
<g filter="url(#glow)">
  <circle r="6" fill="#22D3EE"><animateMotion dur="2.8s" repeatCount="indefinite"><mpath href="#aws"/></animateMotion></circle>
  <circle r="6" fill="#60A5FA"><animateMotion dur="3.0s" repeatCount="indefinite"><mpath href="#gha"/></animateMotion></circle>
  <circle r="6" fill="#A78BFA"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#docker"/></animateMotion></circle>
  <circle r="6" fill="#8B5CF6"><animateMotion dur="2.9s" repeatCount="indefinite"><mpath href="#tf"/></animateMotion></circle>
  <circle r="6" fill="#F59E0B"><animateMotion dur="3.1s" repeatCount="indefinite"><mpath href="#nginx"/></animateMotion></circle>
  <circle r="6" fill="#EC4899"><animateMotion dur="3.3s" repeatCount="indefinite"><mpath href="#linux"/></animateMotion></circle>
</g>

<!-- Central identity plate: text is isolated from all lines -->
<circle cx="700" cy="290" r="118" fill="#050C17" stroke="url(#cyan)" stroke-width="3"/>
<circle cx="700" cy="290" r="98" fill="#07111E" stroke="#1E4B67" stroke-width="2"/>
<circle cx="700" cy="290" r="78" fill="#07111E" stroke="#8B5CF6" stroke-opacity=".5" stroke-width="2"/>

<!-- Clean rotating accent ring outside typography -->
<path d="M700 156 A134 134 0 1 1 699.9 156"
      fill="none"
      stroke="#22D3EE"
      stroke-width="4"
      stroke-linecap="round"
      stroke-dasharray="72 340">
  <animateTransform attributeName="transform" type="rotate"
                    from="0 700 290" to="360 700 290"
                    dur="8s" repeatCount="indefinite"/>
</path>

<!-- Opaque center text panel -->
<rect x="603" y="240" width="194" height="100" rx="20"
      fill="#07111E" stroke="#173750" stroke-width="1.5"/>

<text x="700" y="276" text-anchor="middle"
      fill="#F8FAFC" font-family="DejaVu Sans, Arial, sans-serif"
      font-size="31" font-weight="800">
  HARI PATEL
</text>

<text x="700" y="305" text-anchor="middle"
      fill="#22D3EE" font-family="DejaVu Sans, Arial, sans-serif"
      font-size="18" font-weight="800" letter-spacing=".6">
  DEVOPS ENGINEER
</text>

<text x="700" y="328" text-anchor="middle"
      fill="#94A3B8" font-family="DejaVu Sans Mono, monospace"
      font-size="11" letter-spacing=".6">
  CLOUD • AUTOMATION • RELIABILITY
</text>

<!-- Left nodes -->
<g font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="70" y="105" width="250" height="84" rx="20" fill="#071727" stroke="#22D3EE" stroke-width="2"/>
  <text x="195" y="140" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800">AWS</text>
  <text x="195" y="162" text-anchor="middle" fill="#7DD3FC" font-size="12">CLOUD INFRASTRUCTURE</text>

  <rect x="70" y="248" width="250" height="84" rx="20" fill="#071727" stroke="#60A5FA" stroke-width="2"/>
  <text x="195" y="283" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">GITHUB ACTIONS</text>
  <text x="195" y="305" text-anchor="middle" fill="#93C5FD" font-size="12">CI / CD AUTOMATION</text>

  <rect x="70" y="391" width="250" height="84" rx="20" fill="#071727" stroke="#A78BFA" stroke-width="2"/>
  <text x="195" y="426" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800">DOCKER</text>
  <text x="195" y="448" text-anchor="middle" fill="#C4B5FD" font-size="12">CONTAINERIZATION</text>
</g>

<!-- Right nodes -->
<g font-family="DejaVu Sans, Arial, sans-serif">
  <rect x="1080" y="105" width="250" height="84" rx="20" fill="#071727" stroke="#8B5CF6" stroke-width="2"/>
  <text x="1205" y="140" text-anchor="middle" fill="#F8FAFC" font-size="20" font-weight="800">TERRAFORM</text>
  <text x="1205" y="162" text-anchor="middle" fill="#C4B5FD" font-size="12">INFRASTRUCTURE AS CODE</text>

  <rect x="1080" y="248" width="250" height="84" rx="20" fill="#071727" stroke="#F59E0B" stroke-width="2"/>
  <text x="1205" y="283" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800">NGINX</text>
  <text x="1205" y="305" text-anchor="middle" fill="#FCD34D" font-size="12">REVERSE PROXY • HTTPS</text>

  <rect x="1080" y="391" width="250" height="84" rx="20" fill="#071727" stroke="#EC4899" stroke-width="2"/>
  <text x="1205" y="426" text-anchor="middle" fill="#F8FAFC" font-size="22" font-weight="800">LINUX</text>
  <text x="1205" y="448" text-anchor="middle" fill="#F9A8D4" font-size="12">PRODUCTION OPERATIONS</text>
</g>

<!-- Bottom mission -->
<rect x="435" y="445" width="530" height="44" rx="22" fill="#081A2A" stroke="#204561"/>
<text x="700" y="474" text-anchor="middle"
      fill="#67E8F9" font-family="DejaVu Sans Mono, monospace"
      font-size="14" font-weight="700">
  BUILD → DEPLOY → OBSERVE → SECURE → SCALE
</text>

<!-- Small pulse points around the core -->
<g fill="#67E8F9">
  <circle cx="505" cy="184" r="4"><animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/></circle>
  <circle cx="895" cy="184" r="4"><animate attributeName="r" values="4;7;4" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="505" cy="396" r="4"><animate attributeName="r" values="4;7;4" dur="2.0s" repeatCount="indefinite"/></circle>
  <circle cx="895" cy="396" r="4"><animate attributeName="r" values="4;7;4" dur="2.3s" repeatCount="indefinite"/></circle>
</g>
</svg>