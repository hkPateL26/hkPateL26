<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="55%" stop-color="#0B1224"/>
      <stop offset="100%" stop-color="#071B26"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#1E3A5F" stroke-width="1" opacity=".3"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>

  <!-- glowing infrastructure line -->
  <path d="M30 330 C250 250, 360 380, 540 300 S850 180, 1170 270"
        fill="none" stroke="#00F5D4" stroke-opacity=".22" stroke-width="3"/>
  <circle cx="210" cy="300" r="5" fill="#00F5D4" filter="url(#glow)">
    <animate attributeName="cx" values="40;1160;40" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="330;220;330" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- terminal -->
  <rect x="62" y="58" width="470" height="270" rx="18" fill="#08111F" stroke="#1D4ED8" stroke-width="2"/>
  <circle cx="88" cy="84" r="6" fill="#FB7185"/>
  <circle cx="108" cy="84" r="6" fill="#FACC15"/>
  <circle cx="128" cy="84" r="6" fill="#4ADE80"/>
  <rect x="62" y="102" width="470" height="1" fill="#163250"/>

  <g font-family="monospace" font-size="19">
    <text x="84" y="138" fill="#64748B">$ whoami</text>
    <text x="84" y="169" fill="#00F5D4">hari@devops:~$</text>
    <text x="255" y="169" fill="#E2E8F0">devops-engineer</text>

    <text x="84" y="204" fill="#64748B">$ pipeline --run</text>
    <text x="84" y="235" fill="#38BDF8">[01]</text><text x="130" y="235" fill="#E2E8F0">git push</text>
    <text x="84" y="262" fill="#38BDF8">[02]</text><text x="130" y="262" fill="#E2E8F0">build + test</text>
    <text x="84" y="289" fill="#38BDF8">[03]</text><text x="130" y="289" fill="#E2E8F0">docker build</text>
    <text x="84" y="316" fill="#38BDF8">[04]</text><text x="130" y="316" fill="#E2E8F0">deploy → production</text>
  </g>

  <text x="580" y="115" font-family="Arial, sans-serif" font-size="64" font-weight="800" fill="#F8FAFC">HARI PATEL</text>
  <rect x="584" y="140" width="365" height="4" rx="2" fill="url(#cyan)">
    <animate attributeName="width" values="70;365;70" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <text x="584" y="190" font-family="Arial, sans-serif" font-size="29" font-weight="700" fill="#00F5D4">
    DEVOPS ENGINEER
  </text>
  <text x="584" y="226" font-family="Arial, sans-serif" font-size="20" fill="#CBD5E1">
    Cloud • CI/CD • Containers • IaC
  </text>

  <!-- architecture chips -->
  <g font-family="Arial, sans-serif" font-weight="700" font-size="15">
    <g transform="translate(584 255)">
      <rect width="120" height="38" rx="19" fill="#10243A" stroke="#38BDF8"/>
      <text x="60" y="25" text-anchor="middle" fill="#7DD3FC">AWS</text>
    </g>
    <g transform="translate(716 255)">
      <rect width="120" height="38" rx="19" fill="#10243A" stroke="#00F5D4"/>
      <text x="60" y="25" text-anchor="middle" fill="#5EEAD4">DOCKER</text>
    </g>
    <g transform="translate(848 255)">
      <rect width="120" height="38" rx="19" fill="#10243A" stroke="#A78BFA"/>
      <text x="60" y="25" text-anchor="middle" fill="#C4B5FD">TERRAFORM</text>
    </g>
    <g transform="translate(980 255)">
      <rect width="120" height="38" rx="19" fill="#10243A" stroke="#F472B6"/>
      <text x="60" y="25" text-anchor="middle" fill="#F9A8D4">K8S</text>
    </g>
  </g>

  <text x="584" y="345" font-family="monospace" font-size="20" fill="#94A3B8">
    build • deploy • automate • scale • repeat
  </text>

  <!-- animated status -->
  <g transform="translate(584 372)">
    <circle cx="8" cy="0" r="7" fill="#4ADE80">
      <animate attributeName="opacity" values="1;.25;1" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <text x="25" y="7" font-family="monospace" font-size="16" fill="#4ADE80">SYSTEM READY</text>
  </g>

  <text x="1080" y="395" font-family="monospace" font-size="14" fill="#475569" text-anchor="end">v2.0 / cloud-native</text>
</svg>
