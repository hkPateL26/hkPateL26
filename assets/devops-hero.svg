<svg width="1400" height="430" viewBox="0 0 1400 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111F"/>
      <stop offset="0.55" stop-color="#0B172A"/>
      <stop offset="1" stop-color="#071E2D"/>
    </linearGradient>
    <linearGradient id="accent" x1="240" y1="60" x2="1140" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#1E3A5F" stroke-opacity=".22"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1400" height="430" rx="30" fill="url(#bg)"/>
  <rect width="1400" height="430" rx="30" fill="url(#grid)"/>

  <!-- top accent -->
  <rect x="0" y="0" width="1400" height="6" fill="url(#accent)"/>

  <!-- terminal / CI panel -->
  <rect x="55" y="58" width="500" height="310" rx="18" fill="#08111F" stroke="#1F3A5A"/>
  <circle cx="84" cy="86" r="6" fill="#F87171"/>
  <circle cx="104" cy="86" r="6" fill="#FBBF24"/>
  <circle cx="124" cy="86" r="6" fill="#34D399"/>
  <text x="154" y="91" fill="#64748B" font-size="14" font-family="monospace">devops-terminal</text>
  <line x1="55" y1="112" x2="555" y2="112" stroke="#16304B"/>

  <g font-family="monospace" font-size="16">
    <text x="82" y="145" fill="#64748B">$</text>
    <text x="102" y="145" fill="#22D3EE">whoami</text>
    <text x="102" y="170" fill="#E2E8F0">hari-patel / devops-engineer</text>

    <text x="82" y="207" fill="#64748B">$</text>
    <text x="102" y="207" fill="#60A5FA">pipeline</text>
    <text x="205" y="207" fill="#E2E8F0">--run production</text>

    <text x="102" y="239" fill="#34D399">✓</text>
    <text x="125" y="239" fill="#CBD5E1">git push</text>

    <text x="102" y="267" fill="#34D399">✓</text>
    <text x="125" y="267" fill="#CBD5E1">build + test</text>

    <text x="102" y="295" fill="#34D399">✓</text>
    <text x="125" y="295" fill="#CBD5E1">docker build</text>

    <text x="102" y="323" fill="#34D399">✓</text>
    <text x="125" y="323" fill="#CBD5E1">deploy → production</text>
  </g>

  <text x="625" y="112" fill="#F8FAFC" font-size="72" font-weight="800" font-family="Arial, sans-serif">HARI PATEL</text>
  <text x="628" y="158" fill="#22D3EE" font-size="30" font-weight="700" font-family="Arial, sans-serif">DEVOPS ENGINEER</text>
  <text x="630" y="197" fill="#CBD5E1" font-size="20" font-family="Arial, sans-serif">Cloud Infrastructure • CI/CD • Automation</text>

  <!-- Architecture nodes -->
  <g font-family="Arial, sans-serif">
    <rect x="625" y="233" width="125" height="58" rx="16" fill="#0D2135" stroke="#22D3EE"/>
    <text x="687" y="269" fill="#E2E8F0" text-anchor="middle" font-size="16" font-weight="700">AWS</text>

    <rect x="780" y="233" width="125" height="58" rx="16" fill="#0D2135" stroke="#60A5FA"/>
    <text x="842" y="269" fill="#E2E8F0" text-anchor="middle" font-size="16" font-weight="700">DOCKER</text>

    <rect x="935" y="233" width="125" height="58" rx="16" fill="#0D2135" stroke="#A78BFA"/>
    <text x="997" y="269" fill="#E2E8F0" text-anchor="middle" font-size="16" font-weight="700">TERRAFORM</text>

    <rect x="1090" y="233" width="125" height="58" rx="16" fill="#0D2135" stroke="#34D399"/>
    <text x="1152" y="269" fill="#E2E8F0" text-anchor="middle" font-size="16" font-weight="700">K8S</text>

    <path d="M750 262H780M905 262H935M1060 262H1090" stroke="url(#accent)" stroke-width="3"/>
    <circle cx="766" cy="262" r="4" fill="#22D3EE" filter="url(#glow)">
      <animate attributeName="cx" values="750;1215;750" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="625" y="337" fill="#94A3B8" font-size="18" font-family="monospace">Build • Deploy • Automate • Observe • Scale</text>

  <rect x="625" y="360" width="235" height="33" rx="16.5" fill="#0D2A24" stroke="#1E6A58"/>
  <circle cx="647" cy="376.5" r="6" fill="#34D399">
    <animate attributeName="opacity" values="1;.3;1" dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <text x="662" y="382" fill="#A7F3D0" font-size="14" font-family="monospace">production mindset</text>

  <text x="1260" y="395" fill="#475569" font-size="13" font-family="monospace" text-anchor="end">cloud-native • 2026</text>
</svg>
